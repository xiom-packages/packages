#
# The lane manifest is package.xi (packaging, namespace checks, registry).
# This xiom.toml exists because the v0.64.x dependency-root resolver reads
# xiom.toml `[dependencies]` for catalog source roots (C-PULSE-02/m212); the
# legacy package.xi `deps:` block is not consumed for catalog source roots.
# Both in-tree sibling packages are consumed as PATH dependencies here: the
# coverage-program siblings are built from this repository checkout and are
# not (yet) installed under $XIOM_HOME/packages on the lane machine. Keep it
# in sync with package.xi.

[project]
name = "xiom.llm"
version = "0.1.0"

[dependencies]
"xiom.gguf" = { path = "../xiom-gguf" }
"xiom.tensor" = { path = "../xiom-tensor" }
