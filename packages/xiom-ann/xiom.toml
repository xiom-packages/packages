# The lane manifest is package.xi (packaging, namespace checks, registry).
# This xiom.toml exists because the v0.64.3 dependency-root resolver reads
# xiom.toml `[dependencies]` (installed package roots under
# `$XIOM_HOME/packages`); the legacy package.xi `deps:` block is not
# consumed for catalog source roots. Keep it in sync with package.xi.

[project]
name = "xiom.ann"
version = "0.1.0"

[dependencies]
xiom.vectors = "0.1.0"
