# Registry publish for the xiom-packages ecosystem -- OIDC trusted publishing.
# Copyright (c) 2026 Eleftherios Notas and The XIOM Authors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Contract:
#   - GitHub OIDC -> short-lived registry token (audience: xiom-registry).
#     No long-lived publish secret is stored in this repository.
#   - The job runs in the `registry-publish` environment (required reviewers).
#   - Triggers:
#       `eco-v*` tag            -> publish the full allowlisted batch
#       `xiom-<folder>/v<ver>`  -> publish exactly that one package; the tag
#                                  version must equal the manifest version
#       workflow_dispatch       -> staging canary path (`package` input)
#   - A `guard` job runs scripts/allowlist-guard.ps1 before anything is
#     published: the allowlist may never drift ahead of readiness
#     (stage: stable + recorded green suite in packages/<dir>/STATUS.json).
#   - Tools come from the public xiom release pinned in COMPILER_VERSION;
#     v0.61.0 or newer is required because `xiom pkg` ships from v0.61.0.
#   - Only names listed in .github/publish-allowlist.txt are published;
#     anything else is skipped. A published version is immutable forever, so
#     the allowlist is the readiness gate for real source.
#   - Readiness filter (same rule as scripts/allowlist-guard.ps1): batches
#     publish only packages whose STATUS.json is stage=stable with a recorded
#     green suite; unready names are skipped with a warning. Per-package tags
#     and dispatch canaries on unready names are refused (::error), and a tag
#     outside the allowlist fails.
#   - Signing: set the XIOM_SIGNING_KEY secret (64 hex chars) for a stable
#     first-party fingerprint; without it an ephemeral key is generated per
#     run (fine for the canary, warned for a full batch).
#   - xiom.std is owned by the stdlib repository and is never published here.
#     The umbrella xiom.ecosystem is excluded: it needs its own scope and is
#     not a library artifact.
#
# Scope enumeration for the registry: the package names in packages/*/package.xi
# (all two-segment `xiom.<x>` names), minus the exclusions above.
name: XIOM Packages Registry Publish

on:
  push:
    tags: ["eco-v*", "xiom-*/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "ecosystem batch version (informational, e.g. 0.2.0)"
        required: false
      registry:
        description: "registry base URL"
        required: false
        default: "https://registry.xiom-lang.org"
      package:
        description: "canary: publish only this package name (e.g. xiom.core); empty = full batch"
        required: false

# One batch at a time: publishes are immutable and rate limited.
concurrency:
  group: registry-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: allowlist readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run readiness guard
        shell: pwsh
        run: ./scripts/allowlist-guard.ps1

  publish:
    name: publish ecosystem packages
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry-publish
    permissions:
      contents: read
      id-token: write
    env:
      XIOM_REGISTRY: ${{ github.event.inputs.registry || 'https://registry.xiom-lang.org' }}
      BATCH_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      CANARY_PACKAGE: ${{ github.event.inputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve publish target (tag mode)
        if: startsWith(github.ref, 'refs/tags/xiom-')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"                 # e.g. xiom-flags/v0.1.0
          folder="${tag%%/*}"
          version="${tag#*/}"                    # v0.1.0
          case "$version" in
            v*) ;;
            *) echo "::error::tag version must start with 'v': $tag"; exit 1 ;;
          esac
          manifest="packages/$folder/package.xi"
          if [ ! -f "$manifest" ]; then
            echo "::error::no manifest for tagged folder: $manifest"
            exit 1
          fi
          name="$(sed -n 's/.*name:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n1)"
          manifest_version="$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n1)"
          if [ "v$manifest_version" != "$version" ]; then
            echo "::error::tag $tag does not match manifest version $manifest_version of $name"
            exit 1
          fi
          echo "TAG_PACKAGE_NAME=$name" >> "$GITHUB_ENV"
          echo "tag target: $name@$manifest_version ($tag)"

      - name: Mint registry token (GitHub OIDC)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request env is missing; the job needs id-token: write" >&2
            exit 1
          fi
          response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=xiom-registry")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$token" ]; then
            echo "empty OIDC token in response" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "XIOM_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"
          echo "minted registry OIDC token (audience xiom-registry)"

      - name: Install toolchain
        run: |
          set -euo pipefail
          pin="$(tr -d '\r\n ' < COMPILER_VERSION)"
          if [ -z "$pin" ]; then
            echo "COMPILER_VERSION is empty" >&2
            exit 1
          fi
          pv="${pin#v}"
          curl -fsSL -o xiom-compiler.tar.gz \
            "https://github.com/xiom-lang/xiom/releases/download/${pin}/xiom-${pv}-linux-x64.tar.gz"
          mkdir -p compiler
          tar -xzf xiom-compiler.tar.gz -C compiler
          test -x compiler/bin/xiom
          echo "$PWD/compiler/bin" >> "$GITHUB_PATH"
          compiler/bin/xiom --version
          compiler/bin/xiom pkg --help >/dev/null

      - name: Prepare signing key
        env:
          XIOM_SIGNING_KEY: ${{ secrets.XIOM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.xiom/keys"
          if [ -n "${XIOM_SIGNING_KEY:-}" ]; then
            printf '%s' "$XIOM_SIGNING_KEY" | tr -d '\r\n' > "$HOME/.xiom/keys/default.key"
            printf '\n' >> "$HOME/.xiom/keys/default.key"
            chmod 600 "$HOME/.xiom/keys/default.key"
            key_len="$(tr -d '\r\n' < "$HOME/.xiom/keys/default.key" | wc -c)"
            if [ "$key_len" -ne 64 ]; then
              echo "XIOM_SIGNING_KEY must be 64 hex chars (got $key_len)" >&2
              exit 1
            fi
            echo "using stable XIOM_SIGNING_KEY (64 hex chars)"
          else
            if [ -z "${CANARY_PACKAGE:-}" ]; then
              echo "::warning::full batch is using an ephemeral signing key; set the XIOM_SIGNING_KEY secret for a stable first-party fingerprint"
            fi
            xiom pkg keygen
          fi

      - name: Publish packages
        run: |
          set -uo pipefail
          echo "registry: $XIOM_REGISTRY"
          echo "batch:    $BATCH_VERSION"
          published=0
          skipped=0
          failed=0
          failed_list=""
          echo "canary:   ${CANARY_PACKAGE:-<none>}"
          target="${CANARY_PACKAGE:-${TAG_PACKAGE_NAME:-}}"
          if [ -n "${TAG_PACKAGE_NAME:-}" ]; then
            echo "tag:      $TAG_PACKAGE_NAME"
          fi
          echo "target:   ${target:-<full batch>}"
          for manifest in packages/*/package.xi; do
            dir="${manifest%/package.xi}"
            name="$(sed -n 's/.*name:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n1)"
            version="$(sed -n 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n1)"
            if [ -n "$target" ] && [ "$name" != "$target" ]; then
              continue
            fi
            case "$name" in
              xiom.std|xiom.ecosystem)
                if [ -n "${TAG_PACKAGE_NAME:-}" ]; then
                  echo "::error::tagged package is excluded by policy: $name"
                  exit 1
                fi
                echo "skip (excluded by policy): $name"
                skipped=$((skipped+1))
                continue
                ;;
            esac
            if [ -z "$name" ] || [ -z "$version" ]; then
              echo "skip (no name/version): $manifest"
              skipped=$((skipped+1))
              continue
            fi
            if ! grep -qxF "$name" .github/publish-allowlist.txt; then
              if [ -n "${TAG_PACKAGE_NAME:-}" ]; then
                echo "::error::tagged package is not in the publish allowlist: $name"
                exit 1
              fi
              echo "skip (not in publish allowlist): $name@$version"
              skipped=$((skipped+1))
              continue
            fi
            # Readiness filter -- the same rule scripts/allowlist-guard.ps1
            # enforces. Batches skip unready names with a warning (baseline
            # names stay warn-don't-fail in the guard, but they are skipped
            # here so no unverified immutable version can ever publish);
            # explicit targets (per-package tag or dispatch canary) are
            # refused outright.
            ready="no"
            if [ -f "$dir/STATUS.json" ]; then
              stage="$(sed -n 's/.*"stage"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/STATUS.json" | head -n1)"
              test_status="$(sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/STATUS.json" | head -n1)"
              if [ "$stage" = "stable" ] && [ "$test_status" = "pass" ]; then ready="yes"; fi
            else
              stage="<missing STATUS.json>"
              test_status="<missing>"
            fi
            if [ "$ready" != "yes" ]; then
              if [ -n "${TAG_PACKAGE_NAME:-}" ] || [ -n "${CANARY_PACKAGE:-}" ]; then
                echo "::error::publish target is not ready (stage=$stage tests=$test_status): $name"
                exit 1
              fi
              echo "::warning::skip (not ready: stage=$stage tests=$test_status): $name@$version"
              skipped=$((skipped+1))
              continue
            fi
            # Badge stage: write the STATUS.json stage into the packaged
            # manifest so the registry badge can never drift from readiness.
            # CI-only edit on the runner checkout; never committed.
            awk -v st="$stage" '
              $0 ~ /^[[:space:]]*stage[[:space:]]*:/ { next }
              { print; if (!done && $0 ~ /^[[:space:]]*package[[:space:]]/) { print "  stage: \"" st "\";"; done=1 } }
            ' "$dir/package.xi" > "$dir/package.xi.tmp" && mv "$dir/package.xi.tmp" "$dir/package.xi"
            echo "stage badge: $stage"
            code="$(curl -s -o /tmp/pkg.json -w '%{http_code}' "$XIOM_REGISTRY/packages/$name" || true)"
            if [ "$code" = "200" ] && python3 -c 'import json,sys; d=json.load(open("/tmp/pkg.json")); sys.exit(0 if sys.argv[1] in (d.get("versions") or {}) else 1)' "$version"; then
              echo "skip (already published): $name@$version"
              skipped=$((skipped+1))
              continue
            fi
            echo "publish: $name@$version"
            if (cd "$dir" && xiom pkg publish); then
              published=$((published+1))
            else
              echo "retry after 30s (transient failure or rate limit): $name@$version"
              sleep 30
              if (cd "$dir" && xiom pkg publish); then
                published=$((published+1))
              else
                echo "::error::publish failed: $name@$version"
                failed=$((failed+1))
                failed_list="$failed_list $name@$version"
              fi
            fi
            sleep 4   # stay under the 20 publishes/minute limit
          done
          {
            echo "## Registry publish summary"
            echo ""
            echo "- registry: \`$XIOM_REGISTRY\`"
            echo "- batch: \`$BATCH_VERSION\`"
            echo "- published: $published"
            echo "- skipped (already present or excluded): $skipped"
            echo "- failed: $failed"
            if [ -n "$failed_list" ]; then echo "- failed packages:$failed_list"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$target" ] && [ "$published" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            echo "::error::publish target not found: $target"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
